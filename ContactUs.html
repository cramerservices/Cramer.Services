<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f8f9fb;--card:#fff;--accent:#0d6efd;--text:#1b1f24;--muted:#6c757d;--ring:0 0 0 3px rgba(13,110,253,.25)}
    *{box-sizing:border-box}
    body{margin:0;font-family:Poppins,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:720px;margin:2rem auto;padding:1rem}
    .card{background:var(--card);border:1px solid #dee2e6;border-radius:12px;padding:1rem 1.2rem}
    h1{margin:.2rem 0 1rem}
    form{display:grid;gap:.8rem;margin-top:1rem}
    input,select,textarea{width:100%;padding:.75rem;border:1px solid #ced4da;border-radius:6px;font-family:inherit}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
    .cta{display:inline-block;background:var(--accent);color:#fff;padding:.75rem 1rem;border-radius:8px;text-decoration:none;border:0;cursor:pointer;font-weight:600}
    .muted{color:var(--muted)}
  </style>
  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    const EMAILJS_PUBLIC_KEY  = 'TDIki3rqftcomcjJC';
    const EMAILJS_SERVICE_ID  = 'service_ebrskb5';
    const EMAILJS_TEMPLATE_ID = 'template_b95xw46';
    document.addEventListener('DOMContentLoaded', () => {
      if (window.emailjs) emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
    });
  </script>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <h1>Contact Us</h1>
      <p class="muted">We’d love to hear from you. Fill out the form and we’ll get back to you as soon as possible.</p>

      <form id="contactForm" novalidate>
        <input type="text" name="_company" autocomplete="off" style="position:absolute;left:-9999px;opacity:0" tabindex="-1" aria-hidden="true">

        <input name="name" placeholder="Full Name" required>
        <input name="phone" type="tel" inputmode="tel" placeholder="Phone Number" required>
        <input name="email" type="email" placeholder="Email Address" required>
        <select name="service" required>
          <option value="">Select Service Type</option>
          <option value="Electrical">Electrical</option>
          <option value="HVAC">HVAC</option>
          <option value="Plumbing">Plumbing</option>
          <option value="Multiple Services">Multiple Services</option>
          <option value="Other">Other</option>
        </select>
        <textarea name="details" rows="5" placeholder="Tell us about your project (e.g., issue description, service needed, preferred timeline)"></textarea>

        <button class="cta" type="submit">Send Request</button>
        <p id="msg" class="muted" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <script>
    const $$ = sel => document.querySelector(sel);
    function show(text, err=false){
      const el = $$('#msg');
      el.textContent = text;
      el.style.color = err ? '#dc3545' : '#6c757d';
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!window.emailjs) {
        console.error('EmailJS SDK failed to load');
        show('Could not load mail service. Please refresh and try again.', true);
        return;
      }
      emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

      const f = $$('#contactForm');
      const card = $$('#card');

      f.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (f._company && f._company.value) {
          show('Submission blocked.', true);
          return;
        }

        const details = (f.details.value || '').trim();
        const data = {
          subject: 'Contact Form Submission - ' + (f.service.value || 'Service Request'),
          name:    (f.name.value || '').trim(),
          phone:   (f.phone.value || '').trim(),
          email:   (f.email.value || '').trim(),
          service: (f.service.value || '').trim(),
          details: details,
          message: details,
          time:    new Date().toLocaleString()
        };

        if (!data.name || !data.phone || !data.email || !data.service) {
          show('Please complete all required fields.', true); return;
        }

        const btn = f.querySelector('button[type="submit"]');
        const prev = btn.textContent; 
        btn.disabled = true; 
        btn.textContent = 'Sending…'; 
        show('');

        try {
          await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, data);

          card.innerHTML = `
            <h1>Thank you!  We will get back to you as soon as possible.</h1>
            <p class="muted">We received your message and will be in touch soon.</p>
          `;

        } catch (err) {
          console.error(err);
          show('Could not send. Please try again or email cramerservicesllc@gmail.com', true);
          btn.disabled = false; btn.textContent = prev;
        }
      });
    });
  </script>
</body>
</html>

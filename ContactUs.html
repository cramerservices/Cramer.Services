<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f8f9fb;--card:#fff;--accent:#0d6efd;--text:#1b1f24;--muted:#6c757d;--ring:0 0 0 3px rgba(13,110,253,.25)}
    *{box-sizing:border-box}
    body{margin:0;font-family:Poppins,Arial,sans-serif;background:var(--bg);color:var(--text);width:100%;max-width:100%;overflow-x:hidden}
    header{background:var(--card);border-top:6px solid #fff;border-bottom:6px solid #fff;position:sticky;top:0;z-index:50}
    .container{width:100%;max-width:1100px;margin:auto;padding:0 1rem}
    .nav{display:flex;align-items:center;justify-content:flex-start;gap:1rem;padding:.8rem 0}
    .container.nav{padding:0 !important}
    .brand{display:flex;gap:.6rem;align-items:center;font-weight:800}
    a.brand{display:flex;align-items:center}
    a.brand img{height:60px;width:300px;object-fit:contain;display:block}
    @media (max-width:900px){a.brand img{height:50px;width:auto}}
    @media (max-width:600px){.container.nav{padding:.5rem .75rem !important;gap:.4rem;width:100%;max-width:100%}a.brand img{width:150px;max-width:38vw;height:auto}header{width:100%;max-width:100%;overflow:hidden}}
    .wrap{max-width:720px;margin:2rem auto;padding:1rem}
    .card{background:var(--card);border:1px solid #dee2e6;border-radius:12px;padding:1rem 1.2rem}
    h1{margin:.2rem 0 1rem}
    form{display:grid;gap:.8rem;margin-top:1rem}
    input,select,textarea{width:100%;padding:.75rem;border:1px solid #ced4da;border-radius:6px;font-family:inherit}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
    .cta{display:inline-block;background:var(--accent);color:#fff;padding:.75rem 1rem;border-radius:8px;text-decoration:none;border:0;cursor:pointer;font-weight:600}
    .muted{color:var(--muted)}
  </style>

  <script src="assets/js/cramer-lead-email.js"></script>
</head>
<body>
  <header>
    <div class="container nav">
      <a class="brand" href="/" aria-label="Cramer Services Home">
        <img src="LogoNameTrans.png" alt="Cramer Services Logo">
      </a>
    </div>
  </header>

  <div class="wrap">
    <div class="card" id="card">
      <h1>Contact Us</h1>
      <p class="muted">We’d love to hear from you. Fill out the form and we’ll get back to you as soon as possible.</p>

      <form id="contactForm" novalidate>
        <input type="text" name="_company" autocomplete="off" style="position:absolute;left:-9999px;opacity:0" tabindex="-1" aria-hidden="true">

        <input name="name" placeholder="Full Name" required>
        <input name="phone" type="tel" inputmode="tel" placeholder="Phone Number" required>
        <input name="email" type="email" placeholder="Email Address" required>
        <input name="serviceAddress" placeholder="Service Address" required>
        <select name="service" required>
          <option value="">Select Service Type</option>
          <option value="Electrical">Electrical</option>
          <option value="HVAC">HVAC</option>
          <option value="Plumbing">Plumbing</option>
          <option value="Multiple Services">Multiple Services</option>
          <option value="Other">Other</option>
        </select>
        <textarea name="details" rows="5" placeholder="Tell us about your project (e.g., issue description, service needed, preferred timeline)" required></textarea>

        <button class="cta" type="submit">Send Request</button>
        <p id="msg" class="muted" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <script>
    const $$ = sel => document.querySelector(sel);

    function show(text, err = false) {
      const el = $$('#msg');
      el.textContent = text;
      el.style.color = err ? '#dc3545' : '#6c757d';
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!window.CramerEmail) {
        console.error('Supabase/Resend SDK failed to load');
        show('Could not load mail service. Please refresh and try again.', true);
        return;
      }

      const f = $$('#contactForm');
      const card = $$('#card');

      f.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (f._company && f._company.value) {
          show('Submission blocked.', true);
          return;
        }

        const details = (f.details.value || '').trim();
        const serviceAddress = (f.serviceAddress.value || '').trim();

        const data = {
          subject: 'Contact Form Submission - ' + (f.service.value || 'Service Request'),
          name: (f.name.value || '').trim(),
          phone: (f.phone.value || '').trim(),
          email: (f.email.value || '').trim(),
          service: (f.service.value || '').trim(),
          serviceAddress: serviceAddress,
          address: serviceAddress,
          details: details,
          message: details,
          source: 'website_contact_form',
          time: new Date().toLocaleString()
        };

        if (!data.name || !data.phone || !data.email || !data.service || !data.serviceAddress || !data.details) {
          show('Please complete all required fields.', true);
          return;
        }

        const btn = f.querySelector('button[type="submit"]');
        const prev = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Sending...';
        show('');

        try {
          await CramerEmail.send(data);

          card.innerHTML = `
            <h1>Thank you! We will get back to you as soon as possible.</h1>
            <p class="muted">We received your message and will be in touch soon.</p>
          `;
        } catch (err) {
          console.error(err);
          show('Could not send. Please try again or email cramerservicesllc@gmail.com', true);
          btn.disabled = false;
          btn.textContent = prev;
        }
      });
    });
  </script>
</body>
</html>
